apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
    template:
      metadata:
        labels:
          app: order-service
      spec:
        containers:
          - name: order-service
            image: order-service:1.0
            ports:
              - containerPort: 8080
            resources:
              requests:
                memory: "256MI"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
              livenessProbe:
                httpGet:
                  patch: /actuator/health/liveness
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  patch: /actuator/health/readiness
                  port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 5
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "prod"
                - name: DB_PASSWORD
                  valueForm:
                    secretKeyRef:
                      name: order-service-secrets
                      key: db-password